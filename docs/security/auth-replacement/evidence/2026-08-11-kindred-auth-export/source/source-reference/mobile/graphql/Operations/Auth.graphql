mutation Register($input: RegisterInput!) {
  register(input: $input) {
    ...AuthPayloadFields
  }
}

mutation Login($input: LoginInput!) {
  login(input: $input) {
    ...AuthPayloadFields
  }
}

mutation Reactivate($input: LoginInput!) {
  reactivate(input: $input) {
    ...AuthPayloadFields
  }
}

mutation RefreshSession($input: RefreshSessionInput!) {
  refreshSession(input: $input) {
    ...AuthPayloadFields
  }
}

mutation Logout($input: LogoutInput!) {
  logout(input: $input)
}

mutation VerifyEmail($input: VerifyEmailInput!) {
  verifyEmail(input: $input)
}

mutation ResendEmailVerification($input: EmailInput!) {
  resendEmailVerification(input: $input)
}

mutation ForgotPassword($input: EmailInput!) {
  forgotPassword(input: $input)
}

mutation ResetPassword($input: ResetPasswordInput!) {
  resetPassword(input: $input)
}

mutation StartPhoneVerification {
  startPhoneVerification {
    expiresAt
    verificationCode
  }
}

mutation VerifyPhone($input: VerifyPhoneInput!) {
  verifyPhone(input: $input)
}

mutation StartPhoneChange($input: StartPhoneChangeInput!) {
  startPhoneChange(input: $input) {
    expiresAt
    verificationCode
  }
}

mutation VerifyPhoneChange($input: VerifyPhoneInput!) {
  verifyPhoneChange(input: $input) {
    id
    email
    displayName
    phone
    phoneVerified
    emailVerified
    city
    birthYear
    gender
  }
}

fragment AuthPayloadFields on AuthPayload {
  token
  expiresAt
  refreshToken
  refreshExpiresAt
  user {
    id
    email
    displayName
    phone
    phoneVerified
    emailVerified
    city
    birthYear
    gender
  }
}
