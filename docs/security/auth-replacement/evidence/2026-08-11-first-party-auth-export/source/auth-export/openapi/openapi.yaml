openapi: 3.1.0
info:
  title: AviaSurveil360 Auth Export Metadata
  version: 0.1.0-candidate
  description: >-
    Informational metadata routes copied from the source integration boundary.
    This document does not describe an OAuth 2.0 or OpenID Connect authorization
    server because the required protocol endpoints are absent.
servers:
  - url: https://identity.example.invalid
paths:
  /.well-known/openid-configuration:
    get:
      summary: Return source-compatible discovery-shaped metadata
      responses:
        "200":
          description: Metadata object; not evidence of a complete OIDC provider
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /oauth2/jwks:
    get:
      summary: Return RSA public verification keys
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                required: [keys]
