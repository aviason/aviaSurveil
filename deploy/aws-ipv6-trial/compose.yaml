name: aviasurveil360-aws-ipv6-trial

# The three image variables are intentionally required. The build/promotion
# step must provide an immutable @sha256 subject for each image; this file does
# not provide a mutable tag fallback.
x-trial-security: &trial-security
  init: true
  read_only: true
  stop_grace_period: 15s
  pids_limit: 128
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 256M
        pids: 128
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-health-defaults: &health-defaults
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  cloudflared:
    <<: *trial-security
    # Required value format: repository@sha256:<64 lowercase hex characters>.
    image: "${AVIA_TRIAL_CLOUDFLARED_IMAGE:?set a digest-bound linux/arm64 cloudflared image}"
    platform: linux/arm64
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
      - --token-file
      - /run/secrets/tunnel-token
    environment:
      TUNNEL_EDGE_IP_VERSION: "6"
    configs:
      - source: cloudflared_config
        target: /etc/cloudflared/config.yml
        mode: 0444
    secrets:
      - source: cloudflare_tunnel_token
        target: tunnel-token
        mode: 0400
    networks:
      - edge
      - trial-internal
    healthcheck:
      <<: *health-defaults
      test: [CMD, cloudflared, version]
    restart: unless-stopped

  gateway:
    <<: *trial-security
    # Required value format: repository@sha256:<64 lowercase hex characters>.
    image: "${AVIA_TRIAL_GATEWAY_IMAGE:?set a digest-bound linux/arm64 gateway image}"
    build:
      context: ../..
      dockerfile: deploy/aws-ipv6-trial/gateway/Dockerfile
      target: gateway
    platform: linux/arm64
    user: "1000:1000"
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
      - /data:uid=1000,gid=1000,mode=0700
      - /config:uid=1000,gid=1000,mode=0700
    networks:
      - trial-internal
    healthcheck:
      <<: *health-defaults
      test: [CMD, /healthcheck]
    restart: unless-stopped

  web-demo:
    <<: *trial-security
    # Required value format: repository@sha256:<64 lowercase hex characters>.
    image: "${AVIA_TRIAL_WEB_DEMO_IMAGE:?set a digest-bound linux/arm64 web-demo image}"
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: demo
    platform: linux/arm64
    user: "10001:10001"
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    networks:
      - trial-internal
    healthcheck:
      <<: *health-defaults
      test: [CMD, /web-server, healthcheck]
    restart: unless-stopped

configs:
  cloudflared_config:
    file: ./cloudflared/config.yml

secrets:
  cloudflare_tunnel_token:
    # The host-side file is created by an authorized runtime-auth action or a
    # local test fixture. No token value belongs in Compose or user data.
    file: "${AVIA_TRIAL_TUNNEL_TOKEN_FILE:?set a root-owned 0600 tunnel token file}"

networks:
  edge:
    driver: bridge
  trial-internal:
    driver: bridge
    internal: true
