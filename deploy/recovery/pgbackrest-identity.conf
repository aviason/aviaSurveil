[global]
repo1-type=s3
repo1-path=/identity
repo1-s3-bucket=identity-database-backups
repo1-s3-endpoint=backup-minio
repo1-s3-region=local
repo1-s3-uri-style=path
repo1-storage-port=9000
repo1-storage-verify-tls=n
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
repo1-retention-full-type=count
repo1-retention-diff=4
process-max=2
start-fast=y
archive-async=n
spool-path=/var/spool/pgbackrest
lock-path=/tmp/pgbackrest-lock
log-path=/tmp/pgbackrest-log
log-level-console=info

[identity]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-user=auth_preprod
pg1-database=auth_local_preprod
