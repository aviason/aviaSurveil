services:
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    user: "70:70"
    read_only: true
    environment:
      POSTGRES_DB: aviasurveil
      POSTGRES_USER: aviasurveil
      POSTGRES_PASSWORD_FILE: /run/secrets/app_database_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - app_database_password
    ports:
      - "127.0.0.1:${AVIA_TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    tmpfs:
      - /run/postgresql:uid=70,gid=70,mode=0770
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviasurveil -d aviasurveil"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    read_only: true
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_FILE: /run/secrets/smtp_auth_file
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_REQUIRE_STARTTLS: "false"
      MP_SMTP_DISABLE_RDNS: "true"
    secrets:
      - smtp_auth_file
    ports:
      - "127.0.0.1:${AVIA_TEST_MAILPIT_SMTP_PORT:-58025}:1025"
      - "127.0.0.1:${AVIA_TEST_MAILPIT_HTTP_PORT:-58095}:8025"
    volumes:
      - mailpit-test-data:/data
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  object-store-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /data"]
    volumes:
      - object-store-test-data:/data
    restart: "no"

  object-store:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    user: "1000:1000"
    read_only: true
    entrypoint: [/bin/sh, /opt/aviasurveil360/minio-init.sh]
    depends_on:
      object-store-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_API_ACCESS_KEY_FILE: /run/secrets/minio_api_access_key
      MINIO_API_SECRET_KEY_FILE: /run/secrets/minio_api_secret_key
      MINIO_WORKER_ACCESS_KEY_FILE: /run/secrets/minio_worker_access_key
      MINIO_WORKER_SECRET_KEY_FILE: /run/secrets/minio_worker_secret_key
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:4174
    configs:
      - source: minio_init
        target: /opt/aviasurveil360/minio-init.sh
        uid: "1000"
        gid: "1000"
        mode: 0550
    secrets:
      - minio_api_access_key
      - minio_api_secret_key
      - minio_root_password
      - minio_root_user
      - minio_worker_access_key
      - minio_worker_secret_key
    ports:
      - "127.0.0.1:${AVIA_TEST_OBJECT_STORE_PORT:-59001}:9000"
      - "127.0.0.1:${AVIA_TEST_OBJECT_STORE_CONSOLE_PORT:-59002}:9001"
    volumes:
      - object-store-test-data:/data
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/minio-initialized && curl --fail http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

configs:
  minio_init:
    file: ./minio/init.sh

secrets:
  app_database_password:
    file: ${AVIA_TEST_RUNTIME_DIR:?AVIA_TEST_RUNTIME_DIR is required}/secrets/app_database_password
  minio_root_password:
    file: ${AVIA_TEST_RUNTIME_DIR:?AVIA_TEST_RUNTIME_DIR is required}/secrets/minio_root_password
  minio_root_user:
    file: ${AVIA_TEST_RUNTIME_DIR:?AVIA_TEST_RUNTIME_DIR is required}/secrets/minio_root_user
  minio_api_access_key:
    file: ${AVIA_TEST_RUNTIME_DIR:?AVIA_TEST_RUNTIME_DIR is required}/secrets/minio_api_access_key
  minio_api_secret_key:
    file: ${AVIA_TEST_RUNTIME_DIR:?AVIA_TEST_RUNTIME_DIR is required}/secrets/minio_api_secret_key
  minio_worker_access_key:
    file: ${AVIA_TEST_RUNTIME_DIR:?AVIA_TEST_RUNTIME_DIR is required}/secrets/minio_worker_access_key
  minio_worker_secret_key:
    file: ${AVIA_TEST_RUNTIME_DIR:?AVIA_TEST_RUNTIME_DIR is required}/secrets/minio_worker_secret_key
  smtp_auth_file:
    file: ${AVIA_TEST_RUNTIME_DIR:?AVIA_TEST_RUNTIME_DIR is required}/secrets/smtp_auth_file

volumes:
  postgres-test-data:
  object-store-test-data:
  mailpit-test-data:
