version: 1
environment: demo
http:
  listenAddress: 0.0.0.0:8080
  publicOrigin: https://localhost:8443
database:
  host: postgres
  port: 5432
  name: surveil
  user: surveil_runtime
  passwordFile: /run/secrets/surveil_runtime_database_password
identity:
  issuer: https://localhost:8443/identity
  internalIssuer: http://auth:8080
  clientId: aviasurveil360-namibia-demo-web
  clientSecretFile: /run/secrets/oidc_client_secret
  adminEndpoint: http://auth:8081
  adminSecretFile: /run/secrets/auth_admin_secret
session:
  encryptionKeyFile: /run/secrets/session_encryption_key
objectStorage:
  endpoint: http://minio:9000
  publicEndpoint: https://localhost:8443
  accessKeyFile: /run/secrets/minio_api_access_key
  secretKeyFile: /run/secrets/minio_api_secret_key
  buckets:
    quarantine: evidence-quarantine
    cleanEvidence: evidence-clean
    inspectionAttachments: inspection-attachments
    generatedDocuments: generated-documents
scanner:
  mode: disabled
smtp:
  address: mailpit:1025
  username: aviasurveil360
  passwordFile: /run/secrets/smtp_password
