  clamav:
    <<: *runtime-security
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    platform: linux/amd64
    profiles: [full]
    user: "0:0"
    init: false
    entrypoint:
      - /bin/sh
      - /opt/aviasurveil360/clamav-entrypoint.sh
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - clamav-signatures:/var/lib/clamav
    configs:
      - source: clamav_entrypoint
        target: /opt/aviasurveil360/clamav-entrypoint.sh
        uid: "0"
        gid: "0"
        mode: 0550
    tmpfs:
      - /run/clamav:uid=0,gid=101,mode=0770
      - /run/lock:mode=1777
      - /var/log/clamav:uid=0,gid=101,mode=0770
      - /tmp:mode=1777
    networks:
      - platform
      - signature-updates
    healthcheck:
      <<: *health-defaults
      start_period: 60s
      test: [CMD, clamdscan, --ping, "1"]
    restart: unless-stopped

  mailpit-volume-init:
    <<: *runtime-security
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [full, tools]
    user: "0:0"
    entrypoint: [/usr/bin/chown]
    command: [-R, 1000:1000, /data]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    network_mode: none
    volumes:
      - mailpit-data:/data
    restart: "no"

  mailpit:
    <<: *runtime-security
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    profiles: [full]
    user: "1000:1000"
    depends_on:
      mailpit-volume-init:
        condition: service_completed_successfully
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_FILE: /run/secrets/smtp_auth_file
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_REQUIRE_STARTTLS: "false"
      MP_SMTP_DISABLE_RDNS: "true"
    secrets:
      - smtp_auth_file
    volumes:
      - mailpit-data:/data
    tmpfs:
      - /tmp:mode=1777
    networks:
      - platform
      - identity
    healthcheck:
      <<: *health-defaults
      test: [CMD, /mailpit, readyz]
    restart: unless-stopped

  mailpit-tools:
    <<: *runtime-security
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    profiles: [tools]
    user: "1000:1000"
    depends_on:
      mailpit-volume-init:
        condition: service_completed_successfully
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_FILE: /run/secrets/smtp_auth_file
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_REQUIRE_STARTTLS: "false"
      MP_SMTP_DISABLE_RDNS: "true"
    secrets:
      - smtp_auth_file
    ports:
      - target: 1025
        published: "${AVIA_LOCAL_MAILPIT_SMTP_PORT:-1025}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 8025
        published: "${AVIA_LOCAL_MAILPIT_UI_PORT:-8025}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - mailpit-data:/data
    tmpfs:
      - /tmp:mode=1777
    networks:
      - platform
      - tools
    healthcheck:
      <<: *health-defaults
      test: [CMD, /mailpit, readyz]
    restart: unless-stopped

  gotenberg:
    <<: *runtime-security
    image: gotenberg/gotenberg:8.23.2@sha256:56c47f7b913f3b978554115a0191c4a9dcc2558f9090f27f3f13f28a7c2f8329
    profiles: [full]
    user: "1001:1001"
    read_only: true
    environment:
      XDG_CONFIG_HOME: /tmp/.chromium
      XDG_CACHE_HOME: /tmp/.chromium
    command:
      - gotenberg
      - --api-port=3000
      - --api-disable-health-check-logging=true
      - --chromium-disable-routes=false
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
    networks:
      - platform
    healthcheck:
      <<: *health-defaults
      test: [CMD, curl, --fail, http://127.0.0.1:3000/health]
    restart: unless-stopped

