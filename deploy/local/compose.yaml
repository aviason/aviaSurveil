name: aviasurveil360-local

x-runtime-security: &runtime-security
  init: true
  read_only: true
  stop_grace_period: 15s
  pids_limit: 256
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 2G
        pids: 256
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-health-defaults: &health-defaults
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  gateway:
    <<: *runtime-security
    image: aviasurveil360/gateway:local
    build:
      context: ../..
      dockerfile: deploy/local/gateway/Dockerfile
      target: gateway
    profiles: [demo, full]
    user: "1000:1000"
    environment:
      AVIA_WEB_UPSTREAM: web:8080
      AVIA_API_UPSTREAM: api:8080
      AVIA_IDENTITY_UPSTREAM: preprod-auth:8080
    ports:
      - target: 8443
        published: "${AVIA_LOCAL_HTTPS_PORT:-8443}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:mode=1777
    networks:
      - edge
      - frontend
      - identity
      - platform
    healthcheck:
      <<: *health-defaults
      test: [CMD, /healthcheck, https://localhost:8443/]
    restart: unless-stopped

  web-demo:
    <<: *runtime-security
    image: aviasurveil360/web-demo:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: demo
    profiles: [demo]
    user: "10001:10001"
    tmpfs:
      - /tmp:mode=1777
    networks:
      frontend:
        aliases:
          - web
    healthcheck:
      <<: *health-defaults
      test: [CMD, /web-server, healthcheck]
    restart: unless-stopped

  web-http:
    <<: *runtime-security
    image: aviasurveil360/web-http:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: http
    profiles: [full]
    user: "10001:10001"
    tmpfs:
      - /tmp:mode=1777
    networks:
      frontend:
        aliases:
          - web
    healthcheck:
      <<: *health-defaults
      test: [CMD, /web-server, healthcheck]
    restart: unless-stopped

  api:
    <<: *runtime-security
    image: aviasurveil360/api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: api
    profiles: [full]
    user: "10001:10001"
    depends_on:
      migration:
        condition: service_completed_successfully
      preprod-auth:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      AVIA_ENVIRONMENT: production
      AVIA_HTTP_ADDRESS: 0.0.0.0:8080
      AVIA_DATABASE_HOST: postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: aviasurveil360
      AVIA_DATABASE_USER: aviasurveil360
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/app_database_password
      AVIA_OIDC_ISSUER_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/identity"
      AVIA_OIDC_DISCOVERY_URL: http://preprod-auth:8080
      AVIA_OIDC_DISCOVERY_PRIVATE_NETWORK: "true"
      AVIA_OIDC_CLIENT_ID: aviasurveil360-local-preprod-web
      AVIA_OIDC_CLIENT_SECRET_FILE: /run/secrets/preprod_oidc_client_secret
      AVIA_OIDC_REDIRECT_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/auth/callback"
      AVIA_FIRST_PARTY_ADMIN_URL: http://preprod-auth:8081
      AVIA_FIRST_PARTY_ADMIN_SECRET_FILE: /run/secrets/preprod_auth_admin_secret
      AVIA_SESSION_ENCRYPTION_KEY_FILE: /run/secrets/session_encryption_key
      AVIA_OBJECT_STORE_ENDPOINT: minio:9000
      AVIA_OBJECT_STORE_PUBLIC_ENDPOINT: "localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/minio_api_access_key
      AVIA_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/minio_api_secret_key
      AVIA_OBJECT_STORE_TLS: "false"
      AVIA_OBJECT_STORE_PUBLIC_TLS: "true"
      AVIA_OBJECT_STORE_PRIVATE_NETWORK: "true"
      AVIA_OBJECT_STORE_REGION: local
      AVIA_OBJECT_STORE_CORS_ORIGINS: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_QUARANTINE_BUCKET: evidence-quarantine
      AVIA_OBJECT_STORE_CANONICAL_BUCKET: evidence-clean
      AVIA_OBJECT_STORE_ATTACHMENT_BUCKET: inspection-attachments
      AVIA_OBJECT_STORE_DOCUMENT_BUCKET: generated-documents
      AVIA_SCANNER_MODE: clamav
      AVIA_CLAMAV_ADDRESS: clamav:3310
      AVIA_CLAMAV_MAX_SIGNATURE_AGE: 48h
      AVIA_IDENTITY_HEALTH_URL: http://preprod-auth:8080/health/ready
      AVIA_GOTENBERG_HEALTH_URL: http://gotenberg:3000/health
      AVIA_SMTP_HEALTH_ADDRESS: mailpit:1025
      AVIA_RUNTIME_HEALTH_TIMEOUT: 1s
    configs:
      - source: application_config
        target: /etc/aviasurveil360/application.yaml
        mode: 0444
    secrets:
      - app_database_password
      - preprod_auth_admin_secret
      - minio_api_access_key
      - minio_api_secret_key
      - preprod_oidc_client_secret
      - session_encryption_key
    tmpfs:
      - /tmp:mode=1777
    networks:
      - frontend
      - database
      - identity
      - platform
    healthcheck:
      <<: *health-defaults
      test: [CMD, wget, --quiet, --output-document=/dev/null, http://127.0.0.1:8080/health/ready]
    restart: unless-stopped

  worker:
    <<: *runtime-security
    image: aviasurveil360/worker:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: worker
    profiles: [full]
    user: "10001:10001"
    depends_on:
      migration:
        condition: service_completed_successfully
      preprod-auth:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      gotenberg:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      AVIA_ENVIRONMENT: production
      AVIA_DATABASE_HOST: postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: aviasurveil360
      AVIA_DATABASE_USER: aviasurveil360
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/app_database_password
      AVIA_FIRST_PARTY_ADMIN_URL: http://preprod-auth:8081
      AVIA_FIRST_PARTY_ADMIN_SECRET_FILE: /run/secrets/preprod_auth_admin_secret
      AVIA_OIDC_ISSUER_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/identity"
      AVIA_OIDC_CLIENT_ID: aviasurveil360-local-preprod-web
      AVIA_OIDC_CLIENT_SECRET_FILE: /run/secrets/preprod_oidc_client_secret
      AVIA_OIDC_REDIRECT_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/auth/callback"
      AVIA_SESSION_ENCRYPTION_KEY_FILE: /run/secrets/session_encryption_key
      AVIA_OBJECT_STORE_ENDPOINT: minio:9000
      AVIA_OBJECT_STORE_PUBLIC_ENDPOINT: "localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/minio_worker_access_key
      AVIA_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/minio_worker_secret_key
      AVIA_OBJECT_STORE_TLS: "false"
      AVIA_OBJECT_STORE_PUBLIC_TLS: "true"
      AVIA_OBJECT_STORE_PRIVATE_NETWORK: "true"
      AVIA_OBJECT_STORE_REGION: local
      AVIA_OBJECT_STORE_CORS_ORIGINS: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_QUARANTINE_BUCKET: evidence-quarantine
      AVIA_OBJECT_STORE_CANONICAL_BUCKET: evidence-clean
      AVIA_OBJECT_STORE_ATTACHMENT_BUCKET: inspection-attachments
      AVIA_OBJECT_STORE_DOCUMENT_BUCKET: generated-documents
      AVIA_SCANNER_MODE: clamav
      AVIA_CLAMAV_ADDRESS: clamav:3310
      AVIA_CLAMAV_MAX_SIGNATURE_AGE: 48h
      AVIA_GOTENBERG_URL: http://gotenberg:3000
      AVIA_GOTENBERG_TIMEOUT: 30s
      AVIA_GOTENBERG_RENDERER_HASH: sha256:56c47f7b913f3b978554115a0191c4a9dcc2558f9090f27f3f13f28a7c2f8329
      AVIA_SMTP_ADDRESS: mailpit:1025
      AVIA_SMTP_FROM: no-reply@aviasurveil360.local
      AVIA_SMTP_USERNAME: aviasurveil360
      AVIA_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      AVIA_SMTP_TIMEOUT: 10s
      AVIA_SMTP_PRIVATE_NETWORK: "true"
    configs:
      - source: application_config
        target: /etc/aviasurveil360/application.yaml
        mode: 0444
    secrets:
      - app_database_password
      - preprod_auth_admin_secret
      - minio_worker_access_key
      - minio_worker_secret_key
      - preprod_oidc_client_secret
      - session_encryption_key
      - smtp_password
    tmpfs:
      - /tmp:mode=1777
    networks:
      - database
      - identity
      - platform
    healthcheck:
      <<: *health-defaults
      test: [CMD-SHELL, kill -0 1]
    restart: unless-stopped

  migration:
    <<: *runtime-security
    image: aviasurveil360/migration:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: migration
    profiles: [full]
    user: "10001:10001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AVIA_DATABASE_HOST: postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: aviasurveil360
      AVIA_DATABASE_USER: aviasurveil360
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/app_database_password
    secrets:
      - app_database_password
    tmpfs:
      - /tmp:mode=1777
    networks:
      - database
    restart: "no"

  preprod-postgres:
    <<: *runtime-security
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    profiles: [local-preprod-loader]
    user: "70:70"
    environment:
      POSTGRES_DB: aviasurveil360_local_preprod
      POSTGRES_USER: aviasurveil360_preprod_loader
      POSTGRES_PASSWORD_FILE: /run/secrets/preprod_app_database_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - preprod_app_database_password
    volumes:
      - preprod-app-database:/var/lib/postgresql/data
    tmpfs:
      - /run/postgresql:uid=70,gid=70,mode=0770
      - /tmp:mode=1777
    networks:
      - preprod-app-database
    healthcheck:
      <<: *health-defaults
      timeout: 8s
      test:
        - CMD-SHELL
        - >-
          sleep 5;
          pg_isready -U aviasurveil360_preprod_loader
          -d aviasurveil360_local_preprod &&
          psql -U aviasurveil360_preprod_loader
          -d aviasurveil360_local_preprod -tAc 'SELECT 1' |
          grep -qx 1
    restart: unless-stopped

  preprod-migration:
    <<: *runtime-security
    image: aviasurveil360/preprod-migration:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: migration
    profiles: [local-preprod-loader]
    user: "10001:10001"
    depends_on:
      preprod-postgres:
        condition: service_healthy
    environment:
      AVIA_ENVIRONMENT: development
      AVIA_DATABASE_HOST: preprod-postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: aviasurveil360_local_preprod
      AVIA_DATABASE_USER: aviasurveil360_preprod_loader
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/preprod_app_database_password
    secrets:
      - preprod_app_database_password
    tmpfs:
      - /tmp:mode=1777
    networks:
      - preprod-app-database
    restart: "no"

  # This one-shot bootstrap receives the owner credential only long enough to
  # create/update the dedicated non-owner runtime login. Long-lived services
  # below receive only preprod_normal_api's secret.
  preprod-normal-runtime-role-provisioner:
    <<: *runtime-security
    image: aviasurveil360/preprod-normal-runtime-role-provisioner:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: preprod-normal-runtime-role-provisioner
    profiles: [local-preprod-loader]
    user: "10001:10001"
    depends_on:
      preprod-migration:
        condition: service_completed_successfully
    secrets:
      - preprod_app_database_password
      - preprod_normal_api_database_password
    tmpfs:
      - /tmp:mode=1777
    networks:
      - preprod-app-database
    restart: "no"

  preprod-api:
    <<: *runtime-security
    image: aviasurveil360/preprod-api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: api
    profiles: [local-preprod-loader]
    user: "10001:10001"
    depends_on:
      preprod-migration:
        condition: service_completed_successfully
      preprod-normal-runtime-role-provisioner:
        condition: service_completed_successfully
      preprod-canonical-aga-loader:
        condition: service_completed_successfully
      preprod-auth:
        condition: service_healthy
      preprod-minio:
        condition: service_healthy
      preprod-clamav:
        condition: service_healthy
      preprod-gotenberg:
        condition: service_healthy
      preprod-mailpit:
        condition: service_healthy
    environment:
      AVIA_ENVIRONMENT: local-preprod
      # Canonical AGA exercise content is fail-closed unless the qualification
      # runner explicitly supplies the dedicated disposable profile and
      # identity namespace.
      AVIA_PREPROD_PROFILE: ${AVIA_PREPROD_PROFILE:-}
      AVIA_PREPROD_PROFILE_QUALIFICATION: ${AVIA_PREPROD_PROFILE_QUALIFICATION:-false}
      AVIA_PREPROD_IDENTITY_NAMESPACE: ${AVIA_PREPROD_IDENTITY_NAMESPACE:-}
      AVIA_PREPROD_DATABASE_NAME: aviasurveil360_local_preprod
      AVIA_PREPROD_DATABASE_OWNER: aviasurveil360_preprod_loader
      AVIA_HTTP_ADDRESS: 0.0.0.0:8080
      AVIA_OIDC_ISSUER_URL: "${AVIA_PREPROD_WEB_ORIGIN:-https://localhost:8445}/identity"
      AVIA_OIDC_DISCOVERY_URL: http://preprod-auth:8080
      AVIA_OIDC_DISCOVERY_PRIVATE_NETWORK: "true"
      AVIA_OIDC_CLIENT_ID: aviasurveil360-local-preprod-web
      AVIA_OIDC_REDIRECT_URL: "${AVIA_PREPROD_WEB_ORIGIN:-https://localhost:8445}/auth/callback"
      AVIA_FIRST_PARTY_ADMIN_URL: http://preprod-auth:8081
      AVIA_FIRST_PARTY_ADMIN_SECRET_FILE: /run/secrets/preprod_auth_admin_secret
      AVIA_IDENTITY_HEALTH_URL: http://preprod-auth:8080/health/ready
      AVIA_DATABASE_HOST: preprod-postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: aviasurveil360_local_preprod
      AVIA_DATABASE_USER: preprod_normal_api
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/preprod_normal_api_database_password
      AVIA_OBJECT_STORE_ENDPOINT: preprod-minio:9000
      AVIA_OBJECT_STORE_PUBLIC_ENDPOINT: "localhost:${AVIA_PREPROD_HTTPS_PORT:-8445}"
      AVIA_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/preprod_minio_api_access_key
      AVIA_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/preprod_minio_api_secret_key
      AVIA_OBJECT_STORE_TLS: "false"
      AVIA_OBJECT_STORE_PUBLIC_TLS: "true"
      AVIA_OBJECT_STORE_PRIVATE_NETWORK: "true"
      AVIA_OBJECT_STORE_REGION: local
      AVIA_OBJECT_STORE_CORS_ORIGINS: "https://localhost:${AVIA_PREPROD_HTTPS_PORT:-8445}"
      AVIA_OBJECT_STORE_QUARANTINE_BUCKET: evidence-quarantine
      AVIA_OBJECT_STORE_CANONICAL_BUCKET: evidence-clean
      AVIA_OBJECT_STORE_ATTACHMENT_BUCKET: inspection-attachments
      AVIA_OBJECT_STORE_DOCUMENT_BUCKET: generated-documents
      AVIA_SCANNER_MODE: clamav
      AVIA_CLAMAV_ADDRESS: preprod-clamav:3310
      AVIA_CLAMAV_MAX_SIGNATURE_AGE: 48h
      AVIA_GOTENBERG_URL: http://preprod-gotenberg:3000
      AVIA_GOTENBERG_TIMEOUT: 30s
      AVIA_GOTENBERG_RENDERER_HASH: sha256:56c47f7b913f3b978554115a0191c4a9dcc2558f9090f27f3f13f28a7c2f8329
      AVIA_GOTENBERG_HEALTH_URL: http://preprod-gotenberg:3000/health
      AVIA_SMTP_ADDRESS: preprod-mailpit:1025
      AVIA_SMTP_FROM: no-reply@aviasurveil360.local
      AVIA_SMTP_USERNAME: aviasurveil360-preprod
      AVIA_SMTP_PASSWORD_FILE: /run/secrets/preprod_smtp_password
      AVIA_SMTP_PRIVATE_NETWORK: "true"
      AVIA_SMTP_HEALTH_ADDRESS: preprod-mailpit:1025
      AVIA_RUNTIME_HEALTH_TIMEOUT: 1s
      AVIA_DATA_FEED_TENANT_ID: tenant-local-preprod
      AVIA_DATA_FEED_PAYLOAD_KEY_FILE: /run/secrets/preprod_data_feed_payload_key
      AVIA_DATA_FEED_PAYLOAD_KEY_REF: local-preprod-disposable
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        database_password="$$(tr -d '\r\n'
        </run/secrets/preprod_normal_api_database_password)";
        oidc_secret="$$(tr -d '\r\n' </run/secrets/preprod_oidc_client_secret)";
        session_key="$$(tr -d '\r\n' </run/secrets/preprod_session_encryption_key)";
        object_store_access_key="$$(tr -d '\r\n' </run/secrets/preprod_minio_api_access_key)";
        object_store_secret_key="$$(tr -d '\r\n' </run/secrets/preprod_minio_api_secret_key)";
        smtp_password="$$(tr -d '\r\n' </run/secrets/preprod_smtp_password)";
        export AVIA_DATABASE_URL="postgres://preprod_normal_api:$${database_password}@preprod-postgres:5432/aviasurveil360_local_preprod?sslmode=disable";
        export AVIA_OIDC_CLIENT_SECRET="$${oidc_secret}";
        export AVIA_SESSION_ENCRYPTION_KEY="$${session_key}";
        export AVIA_OBJECT_STORE_ACCESS_KEY="$${object_store_access_key}";
        export AVIA_OBJECT_STORE_SECRET_KEY="$${object_store_secret_key}";
        export AVIA_SMTP_PASSWORD="$${smtp_password}";
        unset database_password oidc_secret session_key object_store_access_key object_store_secret_key smtp_password;
        oidc_wait_attempt=0;
        until wget --quiet --output-document=/dev/null
        "$${AVIA_OIDC_DISCOVERY_URL}/.well-known/openid-configuration"; do
          oidc_wait_attempt=$$((oidc_wait_attempt + 1));
          if [ "$${oidc_wait_attempt}" -ge 120 ]; then
            echo "OIDC discovery did not become ready before API startup" >&2;
            exit 1;
          fi;
          sleep 5;
        done;
        exec /app/api
    secrets:
      - preprod_normal_api_database_password
      - preprod_auth_admin_secret
      - preprod_minio_api_access_key
      - preprod_minio_api_secret_key
      - preprod_oidc_client_secret
      - preprod_session_encryption_key
      - preprod_data_feed_payload_key
      - preprod_smtp_password
    tmpfs:
      - /tmp:mode=1777
    networks:
      - preprod-app-database
      - preprod-identity
      - preprod-platform
    healthcheck:
      <<: *health-defaults
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:8080/health/ready
    restart: unless-stopped

  preprod-worker:
    <<: *runtime-security
    image: aviasurveil360/preprod-worker:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: worker
    profiles: [local-preprod-loader]
    user: "10001:10001"
    depends_on:
      preprod-migration:
        condition: service_completed_successfully
      preprod-normal-runtime-role-provisioner:
        condition: service_completed_successfully
      preprod-auth:
        condition: service_healthy
      preprod-minio:
        condition: service_healthy
      preprod-clamav:
        condition: service_healthy
      preprod-gotenberg:
        condition: service_healthy
      preprod-mailpit:
        condition: service_healthy
    environment:
      AVIA_ENVIRONMENT: local-preprod
      AVIA_DATABASE_HOST: preprod-postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: aviasurveil360_local_preprod
      AVIA_DATABASE_USER: preprod_normal_api
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/preprod_normal_api_database_password
      AVIA_OIDC_CLIENT_SECRET_FILE: /run/secrets/preprod_oidc_client_secret
      AVIA_SESSION_ENCRYPTION_KEY_FILE: /run/secrets/preprod_session_encryption_key
      AVIA_OIDC_DISCOVERY_URL: http://preprod-auth:8080
      AVIA_OIDC_DISCOVERY_PRIVATE_NETWORK: "true"
      AVIA_FIRST_PARTY_ADMIN_URL: http://preprod-auth:8081
      AVIA_FIRST_PARTY_ADMIN_SECRET_FILE: /run/secrets/preprod_auth_admin_secret
      AVIA_OIDC_ISSUER_URL: "${AVIA_PREPROD_WEB_ORIGIN:-https://localhost:8445}/identity"
      AVIA_OIDC_CLIENT_ID: aviasurveil360-local-preprod-web
      AVIA_OIDC_REDIRECT_URL: "${AVIA_PREPROD_WEB_ORIGIN:-https://localhost:8445}/auth/callback"
      AVIA_OBJECT_STORE_ENDPOINT: preprod-minio:9000
      AVIA_OBJECT_STORE_PUBLIC_ENDPOINT: "${AVIA_PREPROD_PUBLIC_HOST:-localhost:8445}"
      AVIA_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/preprod_minio_api_access_key
      AVIA_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/preprod_minio_api_secret_key
      AVIA_OBJECT_STORE_TLS: "false"
      AVIA_OBJECT_STORE_PUBLIC_TLS: "true"
      AVIA_OBJECT_STORE_PRIVATE_NETWORK: "true"
      AVIA_OBJECT_STORE_REGION: local
      AVIA_OBJECT_STORE_CORS_ORIGINS: "${AVIA_PREPROD_WEB_ORIGIN:-https://localhost:8445}"
      AVIA_OBJECT_STORE_QUARANTINE_BUCKET: evidence-quarantine
      AVIA_OBJECT_STORE_CANONICAL_BUCKET: evidence-clean
      AVIA_OBJECT_STORE_ATTACHMENT_BUCKET: inspection-attachments
      AVIA_OBJECT_STORE_DOCUMENT_BUCKET: generated-documents
      AVIA_SCANNER_MODE: clamav
      AVIA_CLAMAV_ADDRESS: preprod-clamav:3310
      AVIA_CLAMAV_MAX_SIGNATURE_AGE: 48h
      AVIA_GOTENBERG_URL: http://preprod-gotenberg:3000
      AVIA_GOTENBERG_TIMEOUT: 30s
      AVIA_GOTENBERG_RENDERER_HASH: sha256:56c47f7b913f3b978554115a0191c4a9dcc2558f9090f27f3f13f28a7c2f8329
      AVIA_SMTP_ADDRESS: preprod-mailpit:1025
      AVIA_SMTP_FROM: no-reply@aviasurveil360.local
