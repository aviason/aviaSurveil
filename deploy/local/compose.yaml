name: aviasurveil360-local

x-runtime-security: &runtime-security
  init: true
  read_only: true
  stop_grace_period: 15s
  pids_limit: 256
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 2G
        pids: 256
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-health-defaults: &health-defaults
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  gateway:
    <<: *runtime-security
    image: aviasurveil360/gateway:local
    build:
      context: ../..
      dockerfile: deploy/local/gateway/Dockerfile
      target: gateway
    profiles: [demo, full]
    user: "1000:1000"
    environment:
      AVIA_WEB_UPSTREAM: web:8080
      AVIA_API_UPSTREAM: api:8080
      AVIA_IDENTITY_UPSTREAM: keycloak:8080
    ports:
      - target: 8443
        published: "${AVIA_LOCAL_HTTPS_PORT:-8443}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:mode=1777
    networks:
      - edge
      - frontend
      - identity
      - platform
    healthcheck:
      <<: *health-defaults
      test: [CMD, /healthcheck, https://localhost:8443/]
    restart: unless-stopped

  web-demo:
    <<: *runtime-security
    image: aviasurveil360/web-demo:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: demo
    profiles: [demo]
    user: "10001:10001"
    tmpfs:
      - /tmp:mode=1777
    networks:
      frontend:
        aliases:
          - web
    healthcheck:
      <<: *health-defaults
      test: [CMD, /web-server, healthcheck]
    restart: unless-stopped

  web-http:
    <<: *runtime-security
    image: aviasurveil360/web-http:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: http
    profiles: [full]
    user: "10001:10001"
    tmpfs:
      - /tmp:mode=1777
    networks:
      frontend:
        aliases:
          - web
    healthcheck:
      <<: *health-defaults
      test: [CMD, /web-server, healthcheck]
    restart: unless-stopped

  api:
    <<: *runtime-security
    image: aviasurveil360/api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: api
    profiles: [full]
    user: "10001:10001"
    depends_on:
      migration:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      AVIA_ENVIRONMENT: production
      AVIA_HTTP_ADDRESS: 0.0.0.0:8080
      AVIA_DATABASE_HOST: postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: aviasurveil360
      AVIA_DATABASE_USER: aviasurveil360
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/app_database_password
      AVIA_OIDC_ISSUER_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/identity/realms/aviasurveil360"
      AVIA_OIDC_DISCOVERY_URL: http://keycloak:8080/identity/realms/aviasurveil360
      AVIA_OIDC_DISCOVERY_PRIVATE_NETWORK: "true"
      AVIA_OIDC_CLIENT_ID: aviasurveil360-web
      AVIA_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      AVIA_OIDC_REDIRECT_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/auth/callback"
      AVIA_KEYCLOAK_ADMIN_URL: http://keycloak:8080/identity
      AVIA_KEYCLOAK_REALM: aviasurveil360
      AVIA_KEYCLOAK_SERVICE_CLIENT_ID: aviasurveil360-lifecycle
      AVIA_KEYCLOAK_SERVICE_CLIENT_SECRET_FILE: /run/secrets/keycloak_service_client_secret
      AVIA_SESSION_ENCRYPTION_KEY_FILE: /run/secrets/session_encryption_key
      AVIA_OBJECT_STORE_ENDPOINT: minio:9000
      AVIA_OBJECT_STORE_PUBLIC_ENDPOINT: "localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/minio_api_access_key
      AVIA_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/minio_api_secret_key
      AVIA_OBJECT_STORE_TLS: "false"
      AVIA_OBJECT_STORE_PUBLIC_TLS: "true"
      AVIA_OBJECT_STORE_PRIVATE_NETWORK: "true"
      AVIA_OBJECT_STORE_REGION: local
      AVIA_OBJECT_STORE_CORS_ORIGINS: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_QUARANTINE_BUCKET: evidence-quarantine
      AVIA_OBJECT_STORE_CANONICAL_BUCKET: evidence-clean
      AVIA_OBJECT_STORE_ATTACHMENT_BUCKET: inspection-attachments
      AVIA_OBJECT_STORE_DOCUMENT_BUCKET: generated-documents
      AVIA_SCANNER_MODE: clamav
      AVIA_CLAMAV_ADDRESS: clamav:3310
      AVIA_CLAMAV_MAX_SIGNATURE_AGE: 48h
      AVIA_IDENTITY_HEALTH_URL: http://keycloak:8080/identity/realms/aviasurveil360/.well-known/openid-configuration
      AVIA_GOTENBERG_HEALTH_URL: http://gotenberg:3000/health
      AVIA_SMTP_HEALTH_ADDRESS: mailpit:1025
      AVIA_RUNTIME_HEALTH_TIMEOUT: 1s
    configs:
      - source: application_config
        target: /etc/aviasurveil360/application.yaml
        mode: 0444
    secrets:
      - app_database_password
      - keycloak_service_client_secret
      - minio_api_access_key
      - minio_api_secret_key
      - oidc_client_secret
      - session_encryption_key
    tmpfs:
      - /tmp:mode=1777
    networks:
      - frontend
      - database
      - identity
      - platform
    healthcheck:
      <<: *health-defaults
      test: [CMD, wget, --quiet, --output-document=/dev/null, http://127.0.0.1:8080/health/ready]
    restart: unless-stopped

  worker:
    <<: *runtime-security
    image: aviasurveil360/worker:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: worker
    profiles: [full]
    user: "10001:10001"
    depends_on:
      migration:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      gotenberg:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      AVIA_ENVIRONMENT: production
      AVIA_DATABASE_HOST: postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: aviasurveil360
      AVIA_DATABASE_USER: aviasurveil360
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/app_database_password
      AVIA_KEYCLOAK_ADMIN_URL: http://keycloak:8080/identity
      AVIA_KEYCLOAK_REALM: aviasurveil360
      AVIA_KEYCLOAK_SERVICE_CLIENT_ID: aviasurveil360-lifecycle
      AVIA_KEYCLOAK_SERVICE_CLIENT_SECRET_FILE: /run/secrets/keycloak_service_client_secret
      AVIA_OIDC_ISSUER_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/identity/realms/aviasurveil360"
      AVIA_OIDC_CLIENT_ID: aviasurveil360-web
      AVIA_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      AVIA_OIDC_REDIRECT_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/auth/callback"
      AVIA_SESSION_ENCRYPTION_KEY_FILE: /run/secrets/session_encryption_key
      AVIA_OBJECT_STORE_ENDPOINT: minio:9000
      AVIA_OBJECT_STORE_PUBLIC_ENDPOINT: "localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/minio_worker_access_key
      AVIA_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/minio_worker_secret_key
      AVIA_OBJECT_STORE_TLS: "false"
      AVIA_OBJECT_STORE_PUBLIC_TLS: "true"
      AVIA_OBJECT_STORE_PRIVATE_NETWORK: "true"
      AVIA_OBJECT_STORE_REGION: local
      AVIA_OBJECT_STORE_CORS_ORIGINS: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_QUARANTINE_BUCKET: evidence-quarantine
      AVIA_OBJECT_STORE_CANONICAL_BUCKET: evidence-clean
      AVIA_OBJECT_STORE_ATTACHMENT_BUCKET: inspection-attachments
      AVIA_OBJECT_STORE_DOCUMENT_BUCKET: generated-documents
      AVIA_SCANNER_MODE: clamav
      AVIA_CLAMAV_ADDRESS: clamav:3310
      AVIA_CLAMAV_MAX_SIGNATURE_AGE: 48h
      AVIA_GOTENBERG_URL: http://gotenberg:3000
      AVIA_GOTENBERG_TIMEOUT: 30s
      AVIA_GOTENBERG_RENDERER_HASH: sha256:56c47f7b913f3b978554115a0191c4a9dcc2558f9090f27f3f13f28a7c2f8329
      AVIA_SMTP_ADDRESS: mailpit:1025
      AVIA_SMTP_FROM: no-reply@aviasurveil360.local
      AVIA_SMTP_USERNAME: aviasurveil360
      AVIA_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      AVIA_SMTP_TIMEOUT: 10s
      AVIA_SMTP_PRIVATE_NETWORK: "true"
    configs:
      - source: application_config
        target: /etc/aviasurveil360/application.yaml
        mode: 0444
    secrets:
      - app_database_password
      - keycloak_service_client_secret
      - minio_worker_access_key
      - minio_worker_secret_key
      - oidc_client_secret
      - session_encryption_key
      - smtp_password
    tmpfs:
      - /tmp:mode=1777
    networks:
      - database
      - identity
      - platform
    healthcheck:
      <<: *health-defaults
      test: [CMD-SHELL, kill -0 1]
    restart: unless-stopped

  scheduler:
    <<: *runtime-security
    image: aviasurveil360/scheduler:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: scheduler
    profiles: [full]
    user: "10001:10001"
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      AVIA_ENVIRONMENT: production
      AVIA_DATABASE_HOST: postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: aviasurveil360
      AVIA_DATABASE_USER: aviasurveil360
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/app_database_password
    configs:
      - source: application_config
        target: /etc/aviasurveil360/application.yaml
        mode: 0444
    secrets:
      - app_database_password
    tmpfs:
      - /tmp:mode=1777
    networks:
      - database
    healthcheck:
      <<: *health-defaults
      test: [CMD-SHELL, test -f /tmp/scheduler-ready]
    restart: unless-stopped

  migration:
    <<: *runtime-security
    image: aviasurveil360/migration:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: migration
    profiles: [full]
    user: "10001:10001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AVIA_DATABASE_HOST: postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: aviasurveil360
      AVIA_DATABASE_USER: aviasurveil360
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/app_database_password
    secrets:
      - app_database_password
    tmpfs:
      - /tmp:mode=1777
    networks:
      - database
    restart: "no"

  preprod-postgres:
    <<: *runtime-security
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    profiles: [local-preprod-loader]
    user: "70:70"
    environment:
      POSTGRES_DB: aviasurveil360_local_preprod
      POSTGRES_USER: aviasurveil360_preprod_loader
      POSTGRES_PASSWORD_FILE: /run/secrets/preprod_app_database_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - preprod_app_database_password
    volumes:
      - preprod-app-database:/var/lib/postgresql/data
    tmpfs:
      - /run/postgresql:uid=70,gid=70,mode=0770
      - /tmp:mode=1777
    networks:
      - preprod-app-database
    healthcheck:
      <<: *health-defaults
      timeout: 8s
      test:
        - CMD-SHELL
        - >-
          sleep 5;
          pg_isready -U aviasurveil360_preprod_loader
          -d aviasurveil360_local_preprod &&
          psql -U aviasurveil360_preprod_loader
          -d aviasurveil360_local_preprod -tAc 'SELECT 1' |
          grep -qx 1
    restart: unless-stopped

  preprod-aga-candidate-demo-loader:
    <<: *runtime-security
    image: aviasurveil360/preprod-aga-candidate-demo-loader:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: preprod-aga-candidate-demo-loader
    profiles: [aga-candidate-demo]
    user: "10001:10001"
    depends_on:
      preprod-postgres:
        condition: service_healthy
    secrets:
      - source: preprod_aga_demo_writer_database_password
        target: preprod_aga_demo_writer_database_password
        uid: "10001"
        gid: "10001"
        mode: 0600
    tmpfs:
      - /tmp:mode=1777,size=16m
    networks:
      - preprod-app-database
    restart: "no"

  preprod-aga-demo-role-provisioner:
    <<: *runtime-security
    image: aviasurveil360/preprod-aga-demo-role-provisioner:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: preprod-aga-demo-role-provisioner
    profiles: [aga-candidate-demo]
    user: "10001:10001"
    depends_on:
      preprod-postgres:
        condition: service_healthy
    secrets:
      - preprod_app_database_password
      - preprod_normal_api_database_password
      - preprod_aga_demo_reader_database_password
      - preprod_aga_demo_writer_database_password
    tmpfs:
      - /tmp:mode=1777,size=16m
    networks:
      - preprod-app-database
    restart: "no"

  preprod-aga-demo-workspace-role-provisioner:
    <<: *runtime-security
    image: aviasurveil360/preprod-aga-demo-workspace-role-provisioner:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: preprod-aga-demo-workspace-role-provisioner
    profiles: [aga-demo-workspace-loader]
    user: "10001:10001"
    depends_on:
      preprod-postgres:
        condition: service_healthy
    environment:
      AVIA_AGA_DEMO_WORKSPACE_OWNER_DATABASE_URL: postgres://aviasurveil360_preprod_loader@preprod-postgres:5432/aviasurveil360_local_preprod?sslmode=disable
    secrets:
      - preprod_app_database_password
      - preprod_aga_demo_workspace_fixture_exporter_database_password
      - preprod_aga_demo_workspace_loader_database_password
      - preprod_aga_demo_workspace_reader_database_password
      - preprod_aga_demo_workspace_command_database_password
    tmpfs:
      - /tmp:mode=1777,size=16m
    networks:
      - preprod-app-database
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        app_password="$$(tr -d '\r\n' </run/secrets/preprod_app_database_password)";
        exporter_password="$$(tr -d '\r\n' </run/secrets/preprod_aga_demo_workspace_fixture_exporter_database_password)";
        loader_password="$$(tr -d '\r\n' </run/secrets/preprod_aga_demo_workspace_loader_database_password)";
        reader_password="$$(tr -d '\r\n' </run/secrets/preprod_aga_demo_workspace_reader_database_password)";
        command_password="$$(tr -d '\r\n' </run/secrets/preprod_aga_demo_workspace_command_database_password)";
        export AVIA_AGA_DEMO_WORKSPACE_OWNER_DATABASE_URL="postgres://aviasurveil360_preprod_loader:$${app_password}@preprod-postgres:5432/aviasurveil360_local_preprod?sslmode=disable";
        export AVIA_AGA_DEMO_WORKSPACE_EXPORTER_PASSWORD="$${exporter_password}";
        export AVIA_AGA_DEMO_WORKSPACE_LOADER_PASSWORD="$${loader_password}";
        export AVIA_AGA_DEMO_WORKSPACE_READER_PASSWORD="$${reader_password}";
        export AVIA_AGA_DEMO_WORKSPACE_COMMAND_PASSWORD="$${command_password}";
        unset app_password exporter_password loader_password reader_password command_password;
        exec /app/preprod-aga-demo-workspace-role-provisioner provision
    restart: "no"

  preprod-aga-demo-workspace-fixture-exporter:
    <<: *runtime-security
    image: aviasurveil360/preprod-aga-demo-workspace-fixture-exporter:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: preprod-aga-demo-workspace-fixture-exporter
    profiles: [aga-demo-workspace-loader]
    user: "10001:10001"
    depends_on:
      preprod-aga-demo-workspace-role-provisioner:
        condition: service_completed_successfully
    secrets:
      - preprod_aga_demo_workspace_fixture_exporter_database_password
    tmpfs:
      - /tmp:mode=1777,size=16m
    networks:
      - preprod-app-database
    restart: "no"

  preprod-aga-demo-workspace-loader:
    <<: *runtime-security
    image: aviasurveil360/preprod-aga-demo-workspace-loader:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: preprod-aga-demo-workspace-loader
    profiles: [aga-demo-workspace-loader]
    user: "10001:10001"
    depends_on:
      preprod-aga-demo-workspace-fixture-exporter:
        condition: service_completed_successfully
    secrets:
      - preprod_aga_demo_workspace_loader_database_password
    tmpfs:
      - /tmp:mode=1777,size=16m
    networks:
      - preprod-app-database
    restart: "no"

  preprod-aga-demo-oidc-fixture:
    <<: *runtime-security
    image: aviasurveil360/preprod-aga-demo-oidc-fixture:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: preprod-aga-demo-oidc-fixture
    profiles: [aga-candidate-demo-oidc-fixture]
    user: "10001:10001"
    depends_on:
      preprod-postgres:
        condition: service_healthy
      preprod-keycloak:
        condition: service_healthy
    environment:
      AVIA_PREPROD_RUN_ID: ${AVIA_PREPROD_RUN_ID:-}
      AVIA_PREPROD_OIDC_ISSUER_URL: "http://${AVIA_PREPROD_AGA_OIDC_HOST:-aga-preprod.test}:${AVIA_PREPROD_AGA_OIDC_PORT:-58082}/identity/realms/aviasurveil360-local-preprod"
    secrets:
      - preprod_app_database_password
      - preprod_keycloak_service_client_secret
      - preprod_aga_demo_oidc_qualification_password
    tmpfs:
      - /tmp:mode=1777,size=16m
    networks:
      - preprod-app-database
      - preprod-identity
    restart: "no"

  preprod-aga-demo-api:
    <<: *runtime-security
    image: aviasurveil360/preprod-aga-demo-api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: preprod-aga-demo-api
    profiles: [preproddemo]
    user: "10001:10001"
    depends_on:
      preprod-postgres:
        condition: service_healthy
      preprod-keycloak:
        condition: service_healthy
    environment:
      AVIA_ENVIRONMENT: development
      AVIA_COOKIE_SECURE: "false"
      AVIA_HTTP_ADDRESS: 0.0.0.0:8080
      AVIA_DATABASE_HOST: preprod-postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: aviasurveil360_local_preprod
      AVIA_DATABASE_USER: preprod_normal_api
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/preprod_normal_api_database_password
      AVIA_OIDC_ISSUER_URL: "http://${AVIA_PREPROD_AGA_OIDC_HOST:-aga-preprod.test}:${AVIA_PREPROD_AGA_OIDC_PORT:-58082}/identity/realms/aviasurveil360-local-preprod"
      AVIA_OIDC_DISCOVERY_URL: http://preprod-keycloak:8080/identity/realms/aviasurveil360-local-preprod
      AVIA_OIDC_DISCOVERY_PRIVATE_NETWORK: "true"
      AVIA_OIDC_CLIENT_ID: aviasurveil360-local-preprod-web
      AVIA_OIDC_REDIRECT_URL: "${AVIA_PREPROD_AGA_DEMO_WEB_ORIGIN:-http://127.0.0.1:${AVIA_PREPROD_AGA_WEB_PORT:-4174}}/auth/callback"
      AVIA_KEYCLOAK_ADMIN_URL: http://preprod-keycloak:8080/identity
      AVIA_KEYCLOAK_REALM: aviasurveil360-local-preprod
      AVIA_KEYCLOAK_SERVICE_CLIENT_ID: aviasurveil360-local-preprod-lifecycle
      AVIA_IDENTITY_HEALTH_URL: http://preprod-keycloak:8080/identity/realms/aviasurveil360-local-preprod/.well-known/openid-configuration
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        normal_password="$$(tr -d '\r\n' </run/secrets/preprod_normal_api_database_password)";
        reader_password="$$(tr -d '\r\n' </run/secrets/preprod_aga_demo_reader_database_password)";
        workspace_reader_password="$$(tr -d '\r\n' </run/secrets/preprod_aga_demo_workspace_reader_database_password)";
        workspace_command_password="$$(tr -d '\r\n' </run/secrets/preprod_aga_demo_workspace_command_database_password)";
        oidc_secret="$$(tr -d '\r\n' </run/secrets/preprod_oidc_client_secret)";
        keycloak_secret="$$(tr -d '\r\n' </run/secrets/preprod_keycloak_service_client_secret)";
        session_key="$$(tr -d '\r\n' </run/secrets/preprod_aga_demo_session_encryption_key)";
        export AVIA_DATABASE_URL="postgres://preprod_normal_api:$${normal_password}@preprod-postgres:5432/aviasurveil360_local_preprod?sslmode=disable";
        export AVIA_AGA_DEMO_DATABASE_URL="postgres://preprod_aga_demo_reader:$${reader_password}@preprod-postgres:5432/aviasurveil360_local_preprod?sslmode=disable";
        export AVIA_AGA_DEMO_WORKSPACE_READER_DATABASE_URL="postgres://preprod_aga_demo_workspace_reader:$${workspace_reader_password}@preprod-postgres:5432/aviasurveil360_local_preprod?sslmode=disable";
        export AVIA_AGA_DEMO_WORKSPACE_COMMAND_DATABASE_URL="postgres://preprod_aga_demo_workspace_command:$${workspace_command_password}@preprod-postgres:5432/aviasurveil360_local_preprod?sslmode=disable";
        export AVIA_OIDC_CLIENT_SECRET="$${oidc_secret}";
        export AVIA_KEYCLOAK_SERVICE_CLIENT_SECRET="$${keycloak_secret}";
        export AVIA_SESSION_ENCRYPTION_KEY="$${session_key}";
        unset normal_password reader_password workspace_reader_password workspace_command_password oidc_secret keycloak_secret session_key;
        exec /app/api
    secrets:
      - preprod_normal_api_database_password
      - preprod_aga_demo_reader_database_password
      - preprod_aga_demo_workspace_reader_database_password
      - preprod_aga_demo_workspace_command_database_password
      - preprod_oidc_client_secret
      - preprod_keycloak_service_client_secret
