      AVIA_CANONICAL_AGA_PACKAGE_FILE: /run/input/aga-package.zip
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        database_password="$$(tr -d '\r\n' </run/secrets/preprod_app_database_password)";
        export AVIA_CANONICAL_AGA_DATABASE_URL="postgres://aviasurveil360_preprod_loader:$${database_password}@preprod-postgres:5432/aviasurveil360_local_preprod?sslmode=disable";
        unset database_password;
        exec /app/preprod-canonical-aga-loader load
        --package /run/input/aga-package.zip
        --catalog-version aga-preprod@1.0.0
        --database-url "$${AVIA_CANONICAL_AGA_DATABASE_URL}"
