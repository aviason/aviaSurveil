name: aviasurveil360-local

x-runtime-security: &runtime-security
  init: true
  read_only: true
  stop_grace_period: 15s
  pids_limit: 256
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 2G
        pids: 256
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-health-defaults: &health-defaults
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  gateway:
    <<: *runtime-security
    image: aviasurveil360/gateway:local
    build:
      context: ../..
      dockerfile: deploy/local/gateway/Dockerfile
      target: gateway
    profiles: [full]
    user: "1000:1000"
    environment:
      AVIA_WEB_UPSTREAM: web:8080
      AVIA_API_UPSTREAM: api:8080
      AVIA_IDENTITY_UPSTREAM: auth:8080
    ports:
      - target: 8443
        published: "${AVIA_LOCAL_HTTPS_PORT:-8443}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - type: bind
        source: ./gateway/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    tmpfs: [/tmp:mode=1777]
    networks: [edge, frontend, identity, platform]
    depends_on:
      api: {condition: service_healthy}
      auth: {condition: service_healthy}
      web-http: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      <<: *health-defaults
      test: [CMD, /healthcheck, https://localhost:8443/]
    restart: unless-stopped

  web-demo:
    <<: *runtime-security
    image: aviasurveil360/web-demo:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: demo
    profiles: [demo]
    user: "10001:10001"
    tmpfs: [/tmp:mode=1777]
    networks:
      frontend:
        aliases: [web]
    healthcheck:
      <<: *health-defaults
      test: [CMD, /web-server, healthcheck]
    restart: unless-stopped

  web-http:
    <<: *runtime-security
    image: aviasurveil360/web-http:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: http
      args:
        VITE_AVIA_DISABLE_BROWSER_TELEMETRY: "1"
    profiles: [full]
    user: "10001:10001"
    tmpfs: [/tmp:mode=1777]
    networks:
      frontend:
        aliases: [web]
    healthcheck:
      <<: *health-defaults
      test: [CMD, /web-server, healthcheck]
    restart: unless-stopped

  postgres:
    <<: *runtime-security
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    profiles: [full, test, recovery]
    user: "70:70"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: avia_master
      POSTGRES_PASSWORD_FILE: /run/secrets/rds_master_database_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [rds_master_database_password]
    volumes:
      - app-database:/var/lib/postgresql/data
    tmpfs:
      - /run/postgresql:uid=70,gid=70,mode=0770
      - /tmp:mode=1777
    networks: [database]
    healthcheck:
      <<: *health-defaults
      timeout: 8s
      test: [CMD-SHELL, pg_isready -U avia_master -d postgres]
    restart: unless-stopped

  runtime-database-bootstrap:
    <<: *runtime-security
    image: aviasurveil360/surveil-bootstrap:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: bootstrap
    profiles: [full, test, recovery]
    user: "10001:10001"
    entrypoint: [/app/runtime-database-bootstrap]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AVIA_DATABASE_MASTER_URL_FILE: /run/secrets/rds_master_database_url
      AVIA_DATABASE_RUNTIME_PASSWORD_FILE: /run/secrets/surveil_runtime_database_password
      AVIA_DATABASE_MIGRATION_PASSWORD_FILE: /run/secrets/surveil_migration_database_password
      AVIA_DATABASE_BOOTSTRAP_PASSWORD_FILE: /run/secrets/surveil_bootstrap_database_password
      AVIA_AUTH_DATABASE_PASSWORD_FILE: /run/secrets/auth_runtime_database_password
    secrets: [rds_master_database_url, surveil_runtime_database_password, surveil_migration_database_password, surveil_bootstrap_database_password, auth_runtime_database_password]
    tmpfs: [/tmp:mode=1777]
    networks: [database]
    restart: "no"

  migration:
    <<: *runtime-security
    image: aviasurveil360/migration:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: migration
    profiles: [full, test, recovery]
    user: "10001:10001"
    depends_on:
      runtime-database-bootstrap: {condition: service_completed_successfully}
    environment:
      AVIA_ENVIRONMENT: ${LOCAL_RUNTIME_ENVIRONMENT:-demo}
      AVIA_DATA: "0"
      AVIA_DATABASE_HOST: postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: surveil
      AVIA_DATABASE_USER: surveil_migration
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/surveil_migration_database_password
    secrets: [surveil_migration_database_password]
    tmpfs: [/tmp:mode=1777]
    networks: [database]
    restart: "no"

  runtime-database-permissions:
    <<: *runtime-security
    image: aviasurveil360/surveil-bootstrap:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: bootstrap
    profiles: [full, test, recovery]
    user: "10001:10001"
    entrypoint: [/app/runtime-database-bootstrap, permissions]
    depends_on:
      migration: {condition: service_completed_successfully}
    environment:
      AVIA_DATABASE_MASTER_URL_FILE: /run/secrets/rds_master_database_url
      AVIA_DATABASE_MIGRATION_PASSWORD_FILE: /run/secrets/surveil_migration_database_password
    secrets: [rds_master_database_url, surveil_migration_database_password]
    tmpfs: [/tmp:mode=1777]
    networks: [database]
    restart: "no"

  auth:
    <<: *runtime-security
    image: aviasurveil360/auth:local
    build:
      context: ../../../../shared/auth
      dockerfile: Dockerfile
      target: runtime
    profiles: [full, test, recovery]
    user: "10001:10001"
    depends_on:
      runtime-database-bootstrap: {condition: service_completed_successfully}
    environment:
      AVIA_AUTH_ENVIRONMENT: ${LOCAL_AUTH_ENVIRONMENT:-demo}
      AVIA_AUTH_PROFILE: ${LOCAL_AUTH_PROFILE:-first-party-demo}
      AVIA_AUTH_ONBOARDING_MODE: ${LOCAL_AUTH_ONBOARDING_MODE:-createAndDirectActivate}
      AVIA_AUTH_TARGET: ${AVIA_LOCAL_TARGET:-namibia/demo}
      AVIA_AUTH_HTTP_ADDRESS: 0.0.0.0:8080
      AVIA_AUTH_ADMIN_HTTP_ADDRESS: 0.0.0.0:8081
      AVIA_AUTH_BOOTSTRAP_SECRET_FILE: /run/secrets/auth_bootstrap_secret
      AVIA_AUTH_ISSUER_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/identity"
      AVIA_AUTH_DATABASE_URL_FILE: /run/secrets/auth_database_url
      AVIA_AUTH_DATABASE_ROLE: auth_runtime
      AVIA_AUTH_DATABASE_SCHEMA: auth_identity
      AVIA_AUTH_SIGNING_KEY_FILE: /run/secrets/auth_signing_key
      AVIA_AUTH_SIGNING_KEY_ID: ${LOCAL_SIGNING_KEY_ID:-avia-namibia-demo-auth-signing-2026}
      AVIA_AUTH_SIGNING_ALGORITHM: RS256
      AVIA_AUTH_DATA_ENCRYPTION_KEY_FILE: /run/secrets/auth_data_encryption_key
      AVIA_AUTH_MFA_KEY_FILE: /run/secrets/auth_mfa_key
      AVIA_AUTH_OIDC_CLIENT_ID: ${LOCAL_OIDC_CLIENT_ID:-aviasurveil360-namibia-demo-web}
      AVIA_AUTH_OIDC_REDIRECT_URI: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/auth/callback"
      AVIA_AUTH_OIDC_POST_LOGOUT_REDIRECT_URI: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/"
      AVIA_AUTH_OIDC_LOGIN_RESTART_URI: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/auth/login"
      AVIA_AUTH_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      AVIA_AUTH_SMTP_MODE: disabled
      AVIA_AUTH_ADMIN_SECRET_FILE: /run/secrets/auth_admin_secret
    secrets: [auth_database_url, auth_signing_key, auth_data_encryption_key, auth_mfa_key, oidc_client_secret, auth_admin_secret, auth_bootstrap_secret]
    tmpfs: [/tmp:mode=1777]
    networks: [identity, database]
    healthcheck:
      <<: *health-defaults
      test: [CMD, wget, --quiet, --output-document=/dev/null, http://127.0.0.1:8080/health/ready]
    restart: unless-stopped

  curated-foundation-loader:
    <<: *runtime-security
    image: aviasurveil360/surveil-bootstrap:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: bootstrap
    profiles: [full, test, recovery]
    user: "10001:10001"
    depends_on:
      runtime-database-permissions: {condition: service_completed_successfully}
    environment:
      AVIA_BOOTSTRAP_TARGET: ${AVIA_LOCAL_TARGET:-namibia/demo}
      AVIA_FOUNDATION_MANIFEST_PATH: /app/bootstrap-manifests/${LOCAL_MANIFEST_PREFIX:-demo}-foundation.json
      AVIA_FOUNDATION_MANIFEST_SHA256: ${AVIA_FOUNDATION_MANIFEST_SHA256:-UNSET}
      AVIA_DATABASE_URL_FILE: /run/secrets/surveil_bootstrap_database_url
    entrypoint: [/app/curated-foundation-loader, load]
    secrets: [surveil_bootstrap_database_url]
    volumes:
      - type: bind
        source: ${AVIA_BOOTSTRAP_MANIFEST_DIR:-../../../../deployments/namibia/manifests}
        target: /app/bootstrap-manifests
        read_only: true
    tmpfs: [/tmp:mode=1777]
    networks: [database]
    restart: "no"

  prepared-roster-loader:
    <<: *runtime-security
    image: aviasurveil360/surveil-bootstrap:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: bootstrap
    profiles: [full, test, recovery]
    user: "10001:10001"
    depends_on:
      curated-foundation-loader: {condition: service_completed_successfully}
      auth: {condition: service_healthy}
    environment:
      AVIA_BOOTSTRAP_TARGET: ${AVIA_LOCAL_TARGET:-namibia/demo}
      AVIA_ROSTER_MANIFEST_PATH: /app/bootstrap-manifests/${LOCAL_MANIFEST_PREFIX:-demo}-identity-roster.json
      AVIA_ROSTER_MANIFEST_SHA256: ${AVIA_ROSTER_MANIFEST_SHA256:-UNSET}
      AVIA_DATABASE_URL_FILE: /run/secrets/surveil_bootstrap_database_url
      AVIA_AUTH_ADMIN_URL: http://auth:8081
      AVIA_AUTH_BOOTSTRAP_SECRET_FILE: /run/secrets/auth_bootstrap_secret
      AVIA_OIDC_ISSUER_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/identity"
      AVIA_ROSTER_CREDENTIAL_DIRECTORY: /run/roster-credentials
    entrypoint: [/app/prepared-roster-loader, load]
    secrets: [surveil_bootstrap_database_url, auth_bootstrap_secret]
    volumes:
      - type: bind
        source: ${AVIA_BOOTSTRAP_MANIFEST_DIR:-../../../../deployments/namibia/manifests}
        target: /app/bootstrap-manifests
        read_only: true
      - type: bind
        source: ${AVIA_ROSTER_CREDENTIAL_DIRECTORY:-../../.local/aviasurveil360/roster-credentials}
        target: /run/roster-credentials
        read_only: true
    tmpfs: [/tmp:mode=1777]
    networks: [database, identity]
    restart: "no"

  approved-aga-catalog-loader:
    <<: *runtime-security
    image: aviasurveil360/surveil-bootstrap:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: bootstrap
    profiles: [full, test, recovery]
    user: "10001:10001"
    depends_on:
      prepared-roster-loader: {condition: service_completed_successfully}
    environment:
      AVIA_BOOTSTRAP_TARGET: ${AVIA_LOCAL_TARGET:-namibia/demo}
      AVIA_CATALOG_MANIFEST_PATH: /app/bootstrap-manifests/${LOCAL_MANIFEST_PREFIX:-demo}-approved-catalog.json
      AVIA_CATALOG_MANIFEST_SHA256: ${AVIA_CATALOG_MANIFEST_SHA256:-UNSET}
      AVIA_APPROVED_CATALOG_PACKAGE_PATH: /app/bootstrap/AGA_ALL_FORMS_APPROVED_SOURCE_V2.zip
      AVIA_AI_RECOMMENDATION_ARTIFACT_PATH: /app/bootstrap/AGA_AI_CHECKLIST_RECOMMENDATIONS_V1.json
      AVIA_AI_RECOMMENDATION_ARTIFACT_SHA256: ${AVIA_AI_RECOMMENDATION_ARTIFACT_SHA256:-UNSET}
      AVIA_DATABASE_URL_FILE: /run/secrets/surveil_bootstrap_database_url
    entrypoint: [/app/approved-aga-catalog-loader, load]
    secrets: [surveil_bootstrap_database_url]
    volumes:
      - type: bind
        source: ${AVIA_BOOTSTRAP_MANIFEST_DIR:-../../../../deployments/namibia/manifests}
        target: /app/bootstrap-manifests
        read_only: true
    tmpfs: [/tmp:mode=1777]
    networks: [database]
    restart: "no"

  api:
    <<: *runtime-security
    image: aviasurveil360/api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: api
    profiles: [full]
    user: "10001:10001"
    depends_on:
      approved-aga-catalog-loader: {condition: service_completed_successfully}
      auth: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      AVIA_ENVIRONMENT: ${LOCAL_RUNTIME_ENVIRONMENT:-demo}
      AVIA_DATA: "0"
      AVIA_HTTP_ADDRESS: 0.0.0.0:8080
      AVIA_DATABASE_HOST: postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: surveil
      AVIA_DATABASE_USER: surveil_runtime
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/surveil_runtime_database_password
      AVIA_OIDC_ISSUER_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/identity"
      AVIA_OIDC_DISCOVERY_URL: http://auth:8080
      AVIA_OIDC_DISCOVERY_PRIVATE_NETWORK: "true"
      AVIA_OIDC_CLIENT_ID: ${LOCAL_OIDC_CLIENT_ID:-aviasurveil360-namibia-demo-web}
      AVIA_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      AVIA_OIDC_REDIRECT_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/auth/callback"
      AVIA_AUTH_ADMIN_URL: http://auth:8081
      AVIA_AUTH_ADMIN_SECRET_FILE: /run/secrets/auth_admin_secret
      AVIA_SESSION_ENCRYPTION_KEY_FILE: /run/secrets/session_encryption_key
      AVIA_OBJECT_STORE_MODE: minio
      AVIA_OBJECT_STORE_ENDPOINT: minio:9000
      AVIA_OBJECT_STORE_PUBLIC_ENDPOINT: "localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/minio_api_access_key
      AVIA_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/minio_api_secret_key
      AVIA_OBJECT_STORE_TLS: "false"
      AVIA_OBJECT_STORE_PUBLIC_TLS: "true"
      AVIA_OBJECT_STORE_PRIVATE_NETWORK: "true"
      AVIA_OBJECT_STORE_REGION: local
      AVIA_OBJECT_STORE_CORS_ORIGINS: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_SERVER_MANAGED_CORS: ${LOCAL_SERVER_MANAGED_CORS:-}
      AVIA_OBJECT_STORE_QUARANTINE_BUCKET: evidence-quarantine
      AVIA_OBJECT_STORE_CANONICAL_BUCKET: evidence-clean
      AVIA_OBJECT_STORE_ATTACHMENT_BUCKET: inspection-attachments
      AVIA_OBJECT_STORE_DOCUMENT_BUCKET: generated-documents
      AVIA_SCANNER_MODE: ${LOCAL_SCANNER_MODE:-disabled}
      AVIA_IDENTITY_HEALTH_URL: http://auth:8080/health/ready
      AVIA_SMTP_HEALTH_ADDRESS: mailpit:1025
      AVIA_SMTP_ADDRESS: mailpit:1025
      AVIA_SMTP_FROM: no-reply@aviasurveil360.local
      AVIA_SMTP_USERNAME: aviasurveil360
      AVIA_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      AVIA_SMTP_TRANSPORT: private-plaintext
      AVIA_SMTP_PRIVATE_NETWORK: "true"
      AVIA_RUNTIME_HEALTH_TIMEOUT: 1s
    configs:
      - source: application_config
        target: /etc/aviasurveil360/application.yaml
        mode: 0444
    secrets: [surveil_runtime_database_password, auth_admin_secret, minio_api_access_key, minio_api_secret_key, oidc_client_secret, session_encryption_key, smtp_password]
    tmpfs: [/tmp:mode=1777]
    networks: [frontend, database, identity, platform]
    healthcheck:
      <<: *health-defaults
      test: [CMD, wget, --quiet, --output-document=/dev/null, http://127.0.0.1:8080/health/ready]
    restart: unless-stopped

  worker:
    <<: *runtime-security
    image: aviasurveil360/worker:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: worker
    profiles: [full]
    user: "10001:10001"
    depends_on:
      approved-aga-catalog-loader: {condition: service_completed_successfully}
      auth: {condition: service_healthy}
      minio: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    environment:
      AVIA_ENVIRONMENT: ${LOCAL_RUNTIME_ENVIRONMENT:-demo}
      AVIA_DATA: "0"
      AVIA_DATABASE_HOST: postgres
      AVIA_DATABASE_PORT: "5432"
      AVIA_DATABASE_NAME: surveil
      AVIA_DATABASE_USER: surveil_runtime
      AVIA_DATABASE_PASSWORD_FILE: /run/secrets/surveil_runtime_database_password
      AVIA_AUTH_ADMIN_URL: http://auth:8081
      AVIA_AUTH_ADMIN_SECRET_FILE: /run/secrets/auth_admin_secret
      AVIA_OIDC_ISSUER_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/identity"
      AVIA_OIDC_CLIENT_ID: ${LOCAL_OIDC_CLIENT_ID:-aviasurveil360-namibia-demo-web}
      AVIA_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      AVIA_OIDC_REDIRECT_URL: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}/auth/callback"
      AVIA_SESSION_ENCRYPTION_KEY_FILE: /run/secrets/session_encryption_key
      AVIA_OBJECT_STORE_MODE: minio
      AVIA_OBJECT_STORE_ENDPOINT: minio:9000
      AVIA_OBJECT_STORE_PUBLIC_ENDPOINT: "localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/minio_worker_access_key
      AVIA_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/minio_worker_secret_key
      AVIA_OBJECT_STORE_TLS: "false"
      AVIA_OBJECT_STORE_PUBLIC_TLS: "true"
      AVIA_OBJECT_STORE_PRIVATE_NETWORK: "true"
      AVIA_OBJECT_STORE_REGION: local
      AVIA_OBJECT_STORE_CORS_ORIGINS: "https://localhost:${AVIA_LOCAL_HTTPS_PORT:-8443}"
      AVIA_OBJECT_STORE_SERVER_MANAGED_CORS: ${LOCAL_SERVER_MANAGED_CORS:-}
      AVIA_OBJECT_STORE_QUARANTINE_BUCKET: evidence-quarantine
      AVIA_OBJECT_STORE_CANONICAL_BUCKET: evidence-clean
      AVIA_OBJECT_STORE_ATTACHMENT_BUCKET: inspection-attachments
      AVIA_OBJECT_STORE_DOCUMENT_BUCKET: generated-documents
      AVIA_SCANNER_MODE: ${LOCAL_SCANNER_MODE:-disabled}
      AVIA_SMTP_ADDRESS: mailpit:1025
      AVIA_SMTP_FROM: no-reply@aviasurveil360.local
      AVIA_SMTP_USERNAME: aviasurveil360
      AVIA_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      AVIA_SMTP_TRANSPORT: private-plaintext
      AVIA_SMTP_PRIVATE_NETWORK: "true"
      AVIA_WORKER_INTERVAL_MS: "1000"
    configs:
      - source: application_config
        target: /etc/aviasurveil360/application.yaml
        mode: 0444
    secrets: [surveil_runtime_database_password, auth_admin_secret, minio_worker_access_key, minio_worker_secret_key, oidc_client_secret, session_encryption_key, smtp_password]
    tmpfs: [/tmp:mode=1777]
    networks: [database, identity, platform]
    healthcheck:
      <<: *health-defaults
      test: [CMD-SHELL, kill -0 1]
    restart: unless-stopped

  minio-volume-init:
    <<: *runtime-security
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [full, test, recovery]
    user: "0:0"
    entrypoint: [/usr/bin/chown]
    command: [-R, 1000:1000, /data]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    network_mode: none
    volumes: [object-store:/data]
    restart: "no"

  minio:
    <<: *runtime-security
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [full, test, recovery]
    user: "1000:1000"
    depends_on:
      minio-volume-init: {condition: service_completed_successfully}
    entrypoint: [/bin/sh, /opt/aviasurveil360/minio-init.sh]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_API_ACCESS_KEY_FILE: /run/secrets/minio_api_access_key
      MINIO_API_SECRET_KEY_FILE: /run/secrets/minio_api_secret_key
      MINIO_WORKER_ACCESS_KEY_FILE: /run/secrets/minio_worker_access_key
      MINIO_WORKER_SECRET_KEY_FILE: /run/secrets/minio_worker_secret_key
    configs:
      - source: minio_init
        target: /opt/aviasurveil360/minio-init.sh
        uid: "1000"
        gid: "1000"
        mode: 0550
    secrets: [minio_api_access_key, minio_api_secret_key, minio_root_password, minio_root_user, minio_worker_access_key, minio_worker_secret_key]
    volumes: [object-store:/data]
    tmpfs: [/tmp:mode=1777]
    networks: [platform]
    healthcheck:
      <<: *health-defaults
      test: [CMD-SHELL, test -f /tmp/minio-initialized && curl --fail http://127.0.0.1:9000/minio/health/live]
    restart: unless-stopped

  mailpit-volume-init:
    <<: *runtime-security
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [full, tools]
    user: "0:0"
    entrypoint: [/usr/bin/chown]
    command: [-R, 1000:1000, /data]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    network_mode: none
    volumes: [mailpit-data:/data]
    restart: "no"

  mailpit:
    <<: *runtime-security
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    profiles: [full]
    user: "1000:1000"
    depends_on:
      mailpit-volume-init: {condition: service_completed_successfully}
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_FILE: /run/secrets/smtp_auth_file
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_REQUIRE_STARTTLS: "false"
      MP_SMTP_DISABLE_RDNS: "true"
    secrets: [smtp_auth_file]
    volumes: [mailpit-data:/data]
    tmpfs: [/tmp:mode=1777]
    networks: [platform, identity]
    healthcheck:
      <<: *health-defaults
      test: [CMD, /mailpit, readyz]
    restart: unless-stopped

  mailpit-tools:
    <<: *runtime-security
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    profiles: [tools]
    user: "1000:1000"
    depends_on:
      mailpit-volume-init: {condition: service_completed_successfully}
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_FILE: /run/secrets/smtp_auth_file
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_REQUIRE_STARTTLS: "false"
      MP_SMTP_DISABLE_RDNS: "true"
    secrets: [smtp_auth_file]
    ports:
      - target: 1025
        published: "${AVIA_LOCAL_MAILPIT_SMTP_PORT:-1025}"
        host_ip: 127.0.0.1
      - target: 8025
        published: "${AVIA_LOCAL_MAILPIT_UI_PORT:-8025}"
        host_ip: 127.0.0.1
    volumes: [mailpit-data:/data]
    tmpfs: [/tmp:mode=1777]
    networks: [platform, tools]
    healthcheck:
      <<: *health-defaults
      test: [CMD, /mailpit, readyz]
    restart: unless-stopped

